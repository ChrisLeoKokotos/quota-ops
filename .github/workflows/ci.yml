name: CI

# CI must validate stacked Draft PRs before release, not only PRs to main.
# This workflow is read-only and never publishes or signs an installer.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: App validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Google statusLine collector E2E (no credentials)
        run: node scripts/google-statusline-e2e.mjs

      - name: Google statusLine collector to live dashboard browser E2E
        run: node scripts/google-auto-dashboard-e2e.mjs

      - name: Google manual provider browser E2E (no credentials)
        run: node scripts/google-dashboard-e2e.mjs

      - name: Responsive dashboard E2E (19 viewports, both themes and sidebar states)
        run: node scripts/responsive-dashboard-e2e.mjs

  windows-security:
    name: Windows security smoke
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Google statusLine hook and collector E2E on Windows
        run: node scripts/google-statusline-e2e.mjs

      - name: Build production dashboard
        run: npm run build

      - name: Responsive dashboard E2E on Windows
        run: node scripts/responsive-dashboard-e2e.mjs

      - name: Exercise synthetic browser profile lifecycle
        run: node --experimental-strip-types scripts/windows-browser-smoke.ts

      - name: Verify loopback listener and unauthorized requests
        shell: pwsh
        run: ./scripts/windows-security-smoke.ps1
