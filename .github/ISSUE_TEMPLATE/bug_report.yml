name: Bug report
description: Report a reproducible problem in QuotaOps
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a QuotaOps bug. QuotaOps is a product created by SO HOMELY.
        Do not report security vulnerabilities here; follow SECURITY.md instead.
        Remove secrets and sensitive account data from logs and screenshots.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuotaOps version or commit
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version if relevant, browser/version, and affected feature.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Quota / reset state
        - Account management
        - Notifications
        - Voice input
        - Keyboard shortcuts
        - Theme / UI
        - Local persistence
        - Local collector
        - Token Analytics
        - Build / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Browser permission state
      description: For notification or voice issues, note whether the browser permission is allowed, blocked, or unset.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, sensitive account identifiers, personal data, and raw local session content. For Token Analytics issues, prefer the sanitized numeric output of npm run collector:setup -- tokens.
